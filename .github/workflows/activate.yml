name: Bot Runner
on:
  workflow_dispatch: # هذا يضيف لك زر "تشغيل" يدوي

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node index.js # تأكد أن الملف الأساسي في المستودع اسمه index.js
